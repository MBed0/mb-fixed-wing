<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MB Rüzgar Tüneli — Uçan Kanat 688 mm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --oda:#0b1119;        /* test odası duvarı */
  --panel:#111a26;      /* konsol paneli */
  --cizgi:#233246;      /* pano çizgileri */
  --metin:#c8d4e3;      /* ana metin */
  --soluk:#5f7189;      /* etiketler */
  --amber:#ffb454;      /* manometre rakamları */
  --duman:#7fd4ff;      /* duman/akış */
  --tehlike:#ff5d5d;    /* stall */
  --yesil:#69d98c;      /* uçar durumu */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--oda);color:var(--metin);
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---- üst şerit ---- */
header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 18px;background:linear-gradient(180deg,rgba(11,17,25,.95),rgba(11,17,25,.55) 80%,transparent);
  z-index:10;pointer-events:none}
.mb{width:34px;height:34px;border:2px solid var(--amber);border-radius:6px;display:grid;place-items:center;
  font-family:'Chakra Petch';font-weight:700;color:var(--amber);letter-spacing:.5px}
h1{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
h1 small{display:block;font-family:'IBM Plex Mono';font-weight:400;font-size:10px;color:var(--soluk);letter-spacing:.28em;margin-top:2px}
.testid{margin-left:auto;font-size:10px;color:var(--soluk);letter-spacing:.2em;text-align:right}
.testid b{color:var(--metin)}

/* ---- sağ veri sütunu (DAQ) ---- */
#daq{position:fixed;top:64px;right:14px;width:222px;z-index:10;display:flex;flex-direction:column;gap:8px}
.kart{background:var(--panel);border:1px solid var(--cizgi);border-radius:8px;padding:10px 12px}
.kart .et{font-size:9px;letter-spacing:.22em;color:var(--soluk);text-transform:uppercase}
.kart .deger{font-family:'Chakra Petch';font-size:26px;font-weight:700;color:var(--amber);line-height:1.15;
  font-variant-numeric:tabular-nums}
.kart .deger .birim{font-family:'IBM Plex Mono';font-size:11px;font-weight:400;color:var(--soluk);margin-left:4px}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ikili .deger{font-size:19px}
#durum{border-color:var(--yesil)}
#durum .deger{font-size:15px;color:var(--yesil)}
#durum.stall{border-color:var(--tehlike);animation:yanip .7s steps(2) infinite}
#durum.stall .deger{color:var(--tehlike)}
#durum.agir{border-color:var(--amber)}
#durum.agir .deger{color:var(--amber)}
@keyframes yanip{50%{background:#2a1418}}

/* ---- sol konsol ---- */
#konsol{position:fixed;left:14px;bottom:14px;width:262px;z-index:10;background:var(--panel);
  border:1px solid var(--cizgi);border-radius:10px;padding:14px 16px 12px}
#konsol h2{font-family:'Chakra Petch';font-size:11px;letter-spacing:.24em;color:var(--soluk);
  text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.surgu{margin-bottom:11px}
.surgu label{display:flex;justify-content:space-between;font-size:11px;color:var(--metin);margin-bottom:4px}
.surgu label output{color:var(--amber);font-weight:600}
input[type=range]{width:100%;height:22px;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--cizgi);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5.5px;
  border-radius:50%;background:var(--amber);border:2px solid var(--oda);box-shadow:0 0 0 1px var(--amber)}
input[type=range]::-moz-range-track{height:4px;background:var(--cizgi);border-radius:2px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--amber);border:2px solid var(--oda)}
input[type=range].kirmizi::-moz-range-thumb{background:var(--tehlike)}
input[type=range]:focus-visible{outline:2px solid var(--duman);outline-offset:3px;border-radius:4px}
input[type=range].kirmizi::-webkit-slider-thumb{background:var(--tehlike);box-shadow:0 0 0 1px var(--tehlike)}
.dugmeler{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
button{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.06em;color:var(--metin);
  background:#182335;border:1px solid var(--cizgi);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--amber);color:var(--amber)}
button[aria-pressed="true"]{background:var(--amber);color:#20160a;border-color:var(--amber);font-weight:600}
button:focus-visible{outline:2px solid var(--duman);outline-offset:2px}
.onayar{margin-top:9px;padding-top:9px;border-top:1px dashed var(--cizgi)}
.onayar .et{font-size:9px;letter-spacing:.22em;color:var(--soluk);margin-bottom:6px;text-transform:uppercase}

/* ---- alt not / ipucu ---- */
#ipucu{position:fixed;bottom:14px;right:14px;z-index:10;font-size:10px;color:var(--soluk);
  letter-spacing:.08em;text-align:right;line-height:1.7;pointer-events:none}

@media (max-width:820px){
  #daq{width:168px;top:58px}
  .kart .deger{font-size:20px}.ikili .deger{font-size:15px}
  #konsol{width:calc(100% - 196px);max-width:262px}
  #ipucu{display:none}
  h1{font-size:12px}
}
@media (prefers-reduced-motion:reduce){#durum.stall{animation:none;background:#2a1418}}
</style>
</head>

<div id="daq">

<div id="konsol">

  <div class="surgu"><label>Model ağırlığı <output id="o_m">480 g</output></label>
    <input type="range" id="s_m" min="200" max="1200" step="10" value="480" aria-label="Model ağırlığı"></div>
  <div class="surgu"><label>İrtifa (hava yoğunluğu) <output id="o_h">0 m</output></label>
    <input type="range" id="s_h" min="0" max="3000" step="100" value="0" aria-label="İrtifa"></div>
  <div class="dugmeler">
    <button id="b_duman" aria-pressed="true">Duman</button>
    <button id="b_basinc" aria-pressed="false">Basınç boyama</button>
    <button id="b_kuvvet" aria-pressed="true">Kuvvet okları</button>
    <button id="b_durdur" aria-pressed="false">Duraklat</button>
  </div>
  <div class="onayar">
    <div class="et">Ön Ayarlar</div>
    <div class="dugmeler">
      <button data-on="10,3">Süzülüş</button>

      <button data-on="8,17">Stall testi</button>
      <button data-on="14,7">Tırmanış</button>
    </div>
  </div>
</div>

function b64u16(s){const bin=atob(s);const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Uint16Array(a.buffer);}

/* ================= SABİTLER (gerçek modelden ölçüldü) ================= */
const S=0.08381, B=0.688, MAC=0.143, AR=B*B/S;
const CLA=2*Math.PI*AR/(AR+2), A0=-1.2*Math.PI/180, CLMAX=0.95, ASTALL=13.5;
const CD0=0.030, EOS=0.85, MU=1.81e-5;
const rhoAt=h=>1.225*Math.pow(1-2.2557e-5*h,4.256);

/* ================= UÇAK ================= */
const vq=b64u16(GEO_V), fq=b64u16(GEO_F);

const pos=new Float32Array(vq.length);
for(let i=0;i<vq.length;i+=3){
  pos[i]  =lo[0]+vq[i]  /65535*(hi[0]-lo[0]);
  pos[i+1]=lo[1]+vq[i+1]/65535*(hi[1]-lo[1]);

}

geom.setAttribute('position',new THREE.BufferAttribute(pos,3));

/* ================= DUMAN TARAĞI (imza) ================= */
const NP=2600, TAIL=0;
const pGeom=new THREE.BufferGeometry();

/* tarak: girişte 9 sütun x 7 sıra emitör */
const RAKE=[];
for(let ix=0;ix<9;ix++)for(let iz=0;iz<7;iz++)
  RAKE.push([-320+ix*80, -430, -110+iz*38]);
function dogur(i){
  const r=RAKE[(Math.random()*RAKE.length)|0];
  pPos[i*3]=r[0]+(Math.random()-.5)*8;
  pPos[i*3+1]=r[1]+(Math.random()-.5)*30;

}
for(let i=0;i<NP;i++){dogur(i);pAge[i]=Math.random()*4;}

/* engel küreleri: gövde + kanat boyunca istasyonlar (akışı saptırır) */
const BLK=[[0,90,-4,66],
  [70,120,0,40],[140,150,2,34],[210,180,4,28],[280,215,8,22],
  [-70,120,0,40],[-140,150,2,34],[-210,180,4,28],[-280,215,8,22]];

/* ================= DURUM ================= */
const st={V:12,a:4,m:480,h:0,duman:true,basinc:false,kuvvet:true,dur:false};
let CL=0,CD=0,q=0,rho=1.225,stall=false;

function fizik(){
  rho=rhoAt(st.h);
  const ar=st.a*Math.PI/180;
  let cl=CLA*(ar-A0);
  const s=Math.max(0,(st.a-ASTALL)/4);
  if(st.a>ASTALL) cl=Math.max(0.35, CLMAX-0.55*Math.min(s,1.4)*(st.a-ASTALL)/6);
  cl=Math.min(cl,CLMAX);
  stall=st.a>ASTALL;
  CL=cl;
  CD=CD0+cl*cl/(Math.PI*AR*EOS)+(stall?0.06*(st.a-ASTALL):0);
  q=0.5*rho*st.V*st.V;
  const L=q*S*CL, D=q*S*CD;
  const Lg=L/9.81*1000, Dg=D/9.81*1000;
  const re=rho*st.V*MAC/MU;
  const vmin=Math.sqrt(2*(st.m/1000)*9.81/(rho*S*CLMAX*0.85));
  el('d_lift').textContent=Lg.toFixed(0);
  el('d_drag').textContent=Dg.toFixed(1);
  el('d_ld').textContent=(CL/CD).toFixed(1);
  el('d_cl').textContent=CL.toFixed(2);
  el('d_re').textContent=(re/1000).toFixed(0)+'k';
  el('d_vmin').textContent=vmin.toFixed(1);
  const kut=el('durum');
  kut.classList.remove('stall','agir');
  if(stall){kut.classList.add('stall');el('d_durum').textContent='STALL — AKIŞ KOPTU';}
  else if(Lg>=st.m){el('d_durum').textContent='UÇAR · taşıma yeterli';}
  else{kut.classList.add('agir');el('d_durum').textContent='YETERSİZ · hız < '+vmin.toFixed(1)+' m/s';}
  /* okların boyu */
  okL.scale.y=Math.min(2.4,Lg/500);
  okD.scale.y=Math.min(2.4,Dg/120);
  okL.visible=okD.visible=st.kuvvet;
  pivot.rotation.x=st.a*Math.PI/180;   // burun yukarı
  if(st.basinc) boya();
}

/* basınç boyaması: normal-akış açısına dayalı Cp taklidi */
const nrm=geom.getAttribute('normal');
function boya(){
  const ca=Math.cos(pivot.rotation.x), sa=Math.sin(pivot.rotation.x);
  for(let i=0;i<nv;i++){
    let ny=nrm.getY(i), nz=nrm.getZ(i);
    const wy=ny*ca-nz*sa, wz=ny*sa+nz*ca;    // dönüşten sonra dünya normali
    let cp=-wy;                               // akışa (+Y) bakan yüz: basınç
    cp-=0.9*CL*Math.max(0,wz);                // üst yüzeyde emme, CL ile ölçekli
    cp=Math.max(-1,Math.min(1,cp));
    const t=(cp+1)/2;                         // 0 mavi(emme) → 1 kırmızı(basınç)
    renkler[i*3]  =0.15+0.85*t;
    renkler[i*3+1]=0.25+0.35*(1-Math.abs(cp));
    renkler[i*3+2]=0.15+0.85*(1-t);
  }
  geom.getAttribute('color').needsUpdate=true;
}

/* ================= AKIŞ ALANI ================= */
const tmp=new THREE.Vector3();
function akis(p,out){
  /* serbest akım +Y */
  let vx=0, vy=st.V*28, vz=0;
  const ca=Math.cos(pivot.rotation.x), sa=Math.sin(pivot.rotation.x);
  for(let k=0;k<BLK.length;k++){
    const b=BLK[k];
    /* engelleri modelle birlikte döndür (pivot etrafında) */
    const by0=b[1]-PIV.y, bz0=b[2]-PIV.z;
    const bx=b[0], by=PIV.y+by0*ca-bz0*sa, bz=PIV.z+by0*sa+bz0*ca;
    const dx=p.x-bx, dy=p.y-by, dz=p.z-bz;
    const r2=dx*dx+dy*dy+dz*dz, a=b[3];
    if(r2<a*a*16){
      const r=Math.sqrt(r2)+1e-4, a3=a*a*a/(r2*r);
      const ux=dx/r,uy=dy/r,uz=dz/r, dot=uy;   /* akış yönü ŷ */
      vx+=st.V*28*a3*0.5*(3*dot*ux);
      vy+=st.V*28*a3*0.5*(3*dot*uy-1);
      vz+=st.V*28*a3*0.5*(3*dot*uz);
    }
  }
  /* kanat ardında aşağı sapma (downwash) — taşımayla orantılı */
  if(p.y>140 && Math.abs(p.x)<344 && Math.abs(p.z-PIV.z)<130){
    const w=Math.min(1,(p.y-140)/240);
    vz-=CL*st.V*7.5*w;
  }
  /* stall türbülansı: kanat ardında kopmuş akış */
  if(stall && p.y>120 && Math.abs(p.x)<330 && p.z>-40 && p.z<110){
    vx+=(Math.random()-.5)*st.V*22;
    vz+=(Math.random()-.5)*st.V*26;
    vy+=(Math.random()-.6)*st.V*14;
  }
  out.set(vx,vy,vz);
}

/* ================= ETKİLEŞİM ================= */
let yaw=0.9, pit=0.35, dist=980, drag=false, px=0, py=0;
function kamera(){
  camera.position.set(
    Math.sin(yaw)*Math.cos(pit)*dist,
    -Math.cos(yaw)*Math.cos(pit)*dist+130,
    Math.sin(pit)*dist);
  camera.lookAt(0,130,0);
}
canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;
  yaw+=(e.clientX-px)*0.005; pit=Math.max(-1.2,Math.min(1.35,pit+(e.clientY-py)*0.005));
  px=e.clientX;py=e.clientY;kamera();});
canvas.addEventListener('wheel',e=>{e.preventDefault();
  dist=Math.max(380,Math.min(2200,dist*(1+e.deltaY*0.001)));kamera();},{passive:false});

const el=id=>document.getElementById(id);
function bagla(id,out,fmt,key){
  el(id).addEventListener('input',e=>{st[key]=+e.target.value;el(out).textContent=fmt(st[key]);fizik();});
}
bagla('s_v','o_v',v=>v.toFixed(1)+' m/s','V');
bagla('s_a','o_a',v=>v.toFixed(1)+'°','a');
bagla('s_m','o_m',v=>v+' g','m');
bagla('s_h','o_h',v=>v+' m','h');
el('s_a').addEventListener('input',e=>{e.target.classList.toggle('kirmizi',+e.target.value>ASTALL);});
function toggle(id,key,fn){el(id).addEventListener('click',()=>{
  st[key]=!st[key];el(id).setAttribute('aria-pressed',st[key]);if(fn)fn();fizik();});}
toggle('b_duman','duman',()=>duman.visible=st.duman);
toggle('b_basinc','basinc',()=>{mat.vertexColors=st.basinc;mat.needsUpdate=true;
  mat.color.set(st.basinc?0xffffff:0xb9c6d6);});
toggle('b_kuvvet','kuvvet');
toggle('b_durdur','dur');
document.querySelectorAll('[data-on]').forEach(b=>b.addEventListener('click',()=>{
  const [v,a]=b.dataset.on.split(',').map(Number);
  st.V=v;st.a=a;el('s_v').value=v;el('s_a').value=a;
  el('o_v').textContent=v.toFixed(1)+' m/s';el('o_a').textContent=a.toFixed(1)+'°';
  el('s_a').classList.toggle('kirmizi',a>ASTALL);fizik();}));

/* ================= DÖNGÜ ================= */
let son=performance.now(), fA=0, fN=0;
const vv=new THREE.Vector3(), pp=new THREE.Vector3();
function dongu(t){
  requestAnimationFrame(dongu);
  const dt=Math.min(0.05,(t-son)/1000); son=t;
  fA+=dt; fN++; if(fA>1){el('fps').textContent=(fN/fA|0)+' fps';fA=0;fN=0;}
  if(!st.dur && st.duman){
    for(let i=0;i<NP;i++){
      pp.set(pPos[i*3],pPos[i*3+1],pPos[i*3+2]);
      akis(pp,vv);
      pPos[i*3]+=vv.x*dt; pPos[i*3+1]+=vv.y*dt; pPos[i*3+2]+=vv.z*dt;
      pAge[i]+=dt;
      const hiz=vv.length()/(st.V*28);
      const c=Math.min(1.5,hiz);
      pCol[i*3]=0.30+0.55*(c-0.7>0?(c-0.7)*2:0);
      pCol[i*3+1]=0.62*c+0.18;
      pCol[i*3+2]=0.95*Math.min(1,c+0.25);
      if(pPos[i*3+1]>520||pAge[i]>7) dogur(i);
    }
    pGeom.getAttribute('position').needsUpdate=true;
    pGeom.getAttribute('color').needsUpdate=true;
  }
  renderer.render(scene,camera);
}
function boyut(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',boyut);
boyut();kamera();fizik();
requestAnimationFrame(dongu);
</script>
